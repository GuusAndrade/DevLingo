name: devlingo
description: "DevLingo - Ingles tecnico gamificado para desenvolvedores em equipes internacionais"
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.10.7
  flutter: ">=3.38.0"

dependencies:
  bloc: ^8.1.4
  connectivity_plus: ^6.1.0
  cupertino_icons: ^1.0.8
  drift: ^2.21.0
  drift_flutter: ^0.2.4
  equatable: ^2.0.5
  flutter:
    sdk: flutter
  flutter_bloc: ^8.1.6
  flutter_secure_storage: ^9.2.2
  fpdart: ^1.1.0
  freezed_annotation: ^2.4.4
  get_it: ^7.7.0
  go_router: ^14.6.2
  injectable: ^2.4.4
  intl: ^0.20.1
  json_annotation: ^4.9.0
  path_provider: ^2.1.5
  sqlite3_flutter_libs: ^0.5.30
  supabase_flutter: ^2.8.0

dev_dependencies:
  bloc_test: ^9.1.7
  build_runner: ^2.4.13
  drift_dev: ^2.21.0
  flutter_test:
    sdk: flutter
  freezed: ^2.5.7
  injectable_generator: ^2.6.2
  json_serializable: ^6.8.0
  mocktail: ^1.0.4
  very_good_analysis: ^7.0.0

flutter:
  uses-material-design: true

  fonts:
    - family: Lato
      fonts:
        - asset: assets/fonts/Lato/Lato-Light.ttf
          weight: 300
        - asset: assets/fonts/Lato/Lato-Regular.ttf
          weight: 400
        - asset: assets/fonts/Lato/Lato-Italic.ttf
          weight: 400
          style: italic
        - asset: assets/fonts/Lato/Lato-Bold.ttf
          weight: 700
        - asset: assets/fonts/Lato/Lato-BoldItalic.ttf
          weight: 700
          style: italic
        - asset: assets/fonts/Lato/Lato-Black.ttf
          weight: 900
    - family: JetBrainsMono
      fonts:
        - asset: assets/fonts/JetBrainsMono/JetBrainsMono-Variable.ttf
